limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=account_access_limit:10m rate=6r/m;
log_format adc '$remote_addr [$time_local] "$request_method $uri" $status';
server {
    listen 80;
    # Public traffic reaches this loopback-bound web service through our Caddy container.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Docker DNS must be re-read after an API restart/recreation.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $adc_api http://api:8000;
    access_log /var/log/nginx/access.log adc;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # The public classroom uses its own API, signing key and synthetic database.
    set $teaching_api http://teaching-api:8000;
    location = /api/teaching/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        rewrite ^ /api/auth/login break;
        proxy_set_header Host $host;
        proxy_pass $teaching_api;
    }
    location = /api/teaching/auth/scope {
        rewrite ^ /api/auth/scope break;
        proxy_set_header Host $host;
        proxy_pass $teaching_api;
    }
    location ^~ /api/teaching/auth/ { return 404; }
    location ^~ /api/teaching/ {
        rewrite ^/api/teaching/(.*)$ /api/$1 break;
        proxy_set_header Host $host;
        proxy_pass $teaching_api;
    }
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass $adc_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass $adc_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/api/auth/(wechat|register|recovery|reset-password)(/|$) {
        limit_req zone=account_access_limit burst=12 nodelay;
        limit_req_status 429;
        proxy_pass $adc_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /healthz { proxy_pass $adc_api; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
